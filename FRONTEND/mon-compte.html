<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="logo/favicon.svg" />
  <link rel="shortcut icon" href="logo/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="QCMed" />
  <link rel="manifest" href="logo/site.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/mon-compte.css" />
  <title>Mon compte — QCMed</title>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a class="header-brand" href="accueil.html">
      <img src="logo/brain-cercle.png" alt="QCMed" />
      QCMed
    </a>
    <a class="back-link" href="profil.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M5 12l7-7M5 12l7 7" />
      </svg>
      Mon profil
    </a>
  </header>

  <!-- PAGE -->
  <main class="page">

    <!-- Section avatar -->
    <div>
      <div class="section-title">Photo de profil</div>
      <div class="card">
        <div class="avatar-section">
          <div class="avatar-wrap" id="avatarWrap">
            <img class="avatar-img" id="user" src="images/user.svg" alt="Avatar actuel" />
            <button class="plus-btn" id="plus" aria-label="Changer l'avatar" type="button">+</button>
            <!-- Palette d'avatars -->
            <div class="palette" id="palette" role="listbox" aria-label="Choisir un avatar">
              <img class="pdp" src="images/user.svg" alt="Avatar par défaut" role="option" />
              <img class="pdp" src="images/X1.svg" alt="Avatar 1" role="option" />
              <img class="pdp" src="images/X2.svg" alt="Avatar 2" role="option" />
              <img class="pdp" src="images/X3.svg" alt="Avatar 3" role="option" />
              <img class="pdp" src="images/X4.svg" alt="Avatar 4" role="option" />
              <img class="pdp" src="images/Y1.svg" alt="Avatar 5" role="option" />
              <img class="pdp" src="images/Y2.svg" alt="Avatar 6" role="option" />
              <img class="pdp" src="images/Y3.svg" alt="Avatar 7" role="option" />
              <img class="pdp" src="images/Y4.svg" alt="Avatar 8" role="option" />
            </div>
          </div>
          <p class="avatar-hint">Clique sur + pour choisir un avatar</p>
        </div>
      </div>
    </div>

    <!-- Section informations -->
    <div>
      <div class="section-title">Mes informations</div>
      <div class="card">
        <div class="form-section">

          <div class="field">
            <label for="nom">Nom</label>
            <input type="text" id="nom" class="nonvide" placeholder="Votre nom" autocomplete="family-name" />
          </div>

          <div class="field">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" class="nonvide" placeholder="Votre prénom" autocomplete="given-name" />
          </div>

          <div class="field">
            <label for="pseudo2">Pseudo</label>
            <input type="text" id="pseudo2" class="nonvide" placeholder="Votre pseudo" autocomplete="nickname" />
          </div>

          <div class="field">
            <label for="faculte">Faculté</label>
            <input type="text" id="faculte" class="nonvide" placeholder="Ex : Médecine Alger 1" />
          </div>

        </div>
        <button class="save-btn" id="button" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
          </svg>
          Sauvegarder les modifications
        </button>
      </div>
    </div>

  </main>

  <!-- Toast succès -->
  <div class="toast" id="alert_erreur" role="alert" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12" />
    </svg>
    Profil mis à jour avec succès
  </div>

  <script src="script/mon-compte.js"></script>
</body>
</html>
