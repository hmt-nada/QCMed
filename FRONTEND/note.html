<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="logo/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="logo/favicon.svg" />
  <link rel="shortcut icon" href="logo/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="QCMed" />
  <link rel="manifest" href="logo/site.webmanifest" />

  <link rel="stylesheet" href="css/note.css" />
  <title>Évaluation — QCMed</title>
</head>
<body class="body-qcm">

  <div class="header">
    <img class="logo2" src="logo/brain-cercle.png" alt="QCMed logo" />

    <div class="quitter2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 512 512" aria-hidden="true" fill="currentColor">
        <path d="M469.3 469.3H42.7V42.7H256L298.7 0h-256C19.1 0 0 19.1 0 42.7v426.7C0 492.9 19.1 512 42.7 512h426.7c23.6 0 42.7-19.1 42.7-42.7V320l-42.7 42.7v106.6zm-384-42.6C149.1 255.7 234.7 256 362.7 256v85.3L512 192L362.7 42.7V128C85.3 128 85.1 341.1 85.3 426.7"/>
      </svg>
      <a href="accueil.html" class="nonlien">
        <p class="ajustquitter">Retour à l'accueil</p>
      </a>
    </div>
  </div>

  <main class="result-page">

    <p class="bigtitle postit">Bravo ! Vous êtes arrivé(e) au bout de ce QCM</p>

    <div class="result-card">

      <p class="bigtitlenote" id="lanote"></p>

      <p class="note-directe" id="note" style="display: none;"></p>

      <p class="bigtitlemark" id="remark2"></p>

      <p class="bigtitlemark2" id="remark"></p>

    </div>

    <div class="actions-row">
      <div class="buttcorr">
        <button class="button" id="btnCorrige">
          <div class="front">Afficher le corrigé du QCM</div>
        </button>
      </div>

      <div class="buttrefais" id="btnrefais">
        <button class="button">
          <div class="front">Nouvelle tentative</div>
        </button>
      </div>
    </div>

  </main>

  <div class="popup2-overlay" id="popup">
    <div class="popup2">
      <h2>Quel corrigé voulez-vous voir ?</h2>
      <button class="btn-all" id="corrigeAll">Tout le QCM</button>
      <button class="btn-false" id="corrigeFalse">Seulement les erreurs</button>
      <br/><br/>
      <button class="btn-cancel" id="cancel">Annuler</button>
    </div>
  </div>

  <div id="popupSucces" style="display:none;"></div>

  <script src="script/nteqcm.js"></script>
</body>
</html>
