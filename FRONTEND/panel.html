<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestion Questions</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; }
    th { background: #007bff; color: white; }
    td[contenteditable="true"] { background: #ffffe0; }
    button { margin: 2px; cursor: pointer; }
    #add-question-btn, #save-all-btn { margin: 10px 5px; padding: 8px 12px; font-size: 16px; }
    img { max-width: 80px; }
    pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
  </style>
</head>
<body>
  <h1>📘 Panel Admin - Gestion des Questions</h1>

  <button id="add-question-btn">➕ Ajouter Question</button>
  <button id="save-all-btn">💾 Sauvegarder tout</button>

  <table id="table-questions">
    <thead>
      <tr>
        
        <th>Faculté</th>
        <th>Module</th>
        <th>Cours</th>
        <th>Question</th>
        <th>Options (JSON)</th>
        <th>Réponses correctes (JSON)</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  let questions = [];
let isLoading = false; // empêche les doubles appels
  async function saveAll() {
  const changedQuestions = questions.filter(q =>
    ["new", "changed", "deleted"].includes(q.state)
  );

  try {
    const res = await fetch("/api/saveChanges", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ questions: changedQuestions })
    });

    const data = await res.json();
    if (data.success) {
      alert("✅ Changements sauvegardés !");
      loadQuestions(); // recharger la table depuis la base
    } else {
      alert("❌ Erreur : " + data.message);
    }
  } catch (err) {
    console.error("Erreur saveAll:", err);
    alert("Erreur réseau : " + err.message);
  }
}

function handleInputChange(index, field, value) {
  // ✅ Met à jour la valeur
  questions[index][field] = value;

  // ✅ On change l’état UNE SEULE FOIS
  if (questions[index].state === "unchanged") {
    questions[index].state = "changed";
  }

  // 🚫 Si c’est déjà "new" ou "changed", on ne fait rien
  // (donc pas de reassignation inutile)

  // ✅ Met juste à jour le badge de statut visuel
  const tr = document.querySelectorAll('tbody tr')[index];
  if (tr) {
    const span = tr.querySelector('span');
    if (span) {
      span.textContent = `(${questions[index].state})`;
      span.style.color =
        questions[index].state === 'new' ? 'green' :
        questions[index].state === 'changed' ? 'orange' :
        questions[index].state === 'deleted' ? 'red' : '#888';
    }
  }
}

function deleteQuestion(index) {
  if (questions[index].state === "new") {
    // Si c’est une question jamais encore en base, on la retire simplement du tableau
    questions.splice(index, 1);
  } else {
    // Si c’est une question existante, on la garde mais on marque pour suppression
    questions[index].state = "deleted";
  }
  renderQuestions();
}
function addQuestion() {
  const newQuestion = {
    faculte: "",
    module: "",
    cours: "",
    question: "",
    options: ["", "", "", ""],
    correct: [],
    image: "",
    state: "new"
  };
  questions.push(newQuestion);
  renderQuestions();
}
const tbody = document.querySelector('#table-questions tbody');

// 🔹 Charger toutes les questions
async function loadQuestions() {
  if (isLoading) {
    console.warn("⚠️ Chargement déjà en cours — ignoré.");
    return;
  }
  isLoading = true;
  console.log("📥 Chargement des questions depuis le serveur...");

  try {
    const res = await fetch('/api/adminquestions');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data.success || !Array.isArray(data.questions)) {
      throw new Error("Format inattendu de la réponse");
    }

    // 🧹 Nettoyer complètement avant de réaffecter
    questions = [];
    questions = data.questions;

    console.log(`✅ ${questions.length} questions chargées.`);
    renderQuestions();

  } catch (err) {
    console.error("❌ Erreur lors du chargement :", err);
    alert("Erreur : " + err.message);
  } finally {
    isLoading = false;
  }
}

function renderQuestions() {
  console.log("🎨 Rendu de", questions.length, "questions");
  tbody.innerHTML = ''; // supprime toutes les lignes existantes avant le rendu

  questions.forEach((q, index) => {
    const tr = document.createElement('tr');
    tr.dataset.id = q.id || '';
    tr.innerHTML = `
      <td contenteditable="true" data-field="faculte">${q.faculte || ''}</td>
      <td contenteditable="true" data-field="module">${q.module || ''}</td>
      <td contenteditable="true" data-field="cours">${q.cours || ''}</td>
      <td contenteditable="true" data-field="question">${q.question || ''}</td>
      <td contenteditable="true" data-field="options">${JSON.stringify(q.options || [])}</td>
      <td contenteditable="true" data-field="correct">${JSON.stringify(q.correct || [])}</td>
      <td contenteditable="true" data-field="image">${q.image || ''}</td>
      <td>
        <button class="delete-btn">❌</button>
        <span style="font-size:12px;color:${
          q.state === 'new' ? 'green' :
          q.state === 'changed' ? 'orange' :
          q.state === 'deleted' ? 'red' : '#888'
        }">(${q.state})</span>
      </td>
    `;
    tbody.appendChild(tr);

    // gestion édition et suppression (comme avant)
    tr.querySelectorAll('[contenteditable="true"]').forEach(td => {
      td.addEventListener('input', () => {
        const field = td.dataset.field;
        let value = td.innerText.trim();
        if (field === 'options' || field === 'correct') {
          try { value = JSON.parse(value); } catch { value = []; }
        }
        handleInputChange(index, field, value);
      });
    });

    tr.querySelector('.delete-btn').onclick = () => deleteQuestion(index);
  });
}


// 🔹 Ajouter une nouvelle question
document.getElementById('add-question-btn').onclick = addQuestion;


// 🔹 Sauvegarder tout
document.getElementById('save-all-btn').onclick = saveAll;




// 🔹 Initialisation
loadQuestions();
</script>
</body>
</html>
