<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Gestion Questions</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; }
    th { background: #007bff; color: white; }
    td[contenteditable="true"] { background: #ffffe0; }
    button { margin: 2px; cursor: pointer; }
    #add-question-btn, #save-all-btn { margin: 10px 5px; padding: 8px 12px; font-size: 16px; }
    img { max-width: 80px; }
    pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
  </style>
</head>
<body>
  <h1>📘 Panel Admin - Gestion des Questions</h1>

  <button id="add-question-btn">➕ Ajouter Question</button>
  <button id="save-all-btn">💾 Sauvegarder tout</button>

  <table id="table-questions">
    <thead>
      <tr>
        <th>ID</th>
        <th>Faculté</th>
        <th>Module</th>
        <th>Cours</th>
        <th>Question</th>
        <th>Options (JSON)</th>
        <th>Réponses correctes (JSON)</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
const tbody = document.querySelector('#table-questions tbody');

// 🔹 Charger toutes les questions
async function loadQuestions() {
  try {
    const res = await fetch('/api/adminquestions');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success || !Array.isArray(data.questions)) throw new Error('Format inattendu');
    renderQuestions(data.questions);
  } catch (err) {
    console.error("❌ Load error:", err);
    alert("Erreur lors du chargement : " + err.message);
  }
}

// 🔹 Affichage et gestion actions
function renderQuestions(questions) {
  tbody.innerHTML = '';
  questions.forEach(q => {
    const tr = document.createElement('tr');
    tr.dataset.id = q.id; // ID pour la sauvegarde
    tr.innerHTML = `
      <td>${q.id}</td>
      <td contenteditable="true" data-field="faculte">${q.faculte || ''}</td>
      <td contenteditable="true" data-field="module">${q.module || ''}</td>
      <td contenteditable="true" data-field="cours">${q.cours || ''}</td>
      <td contenteditable="true" data-field="question">${q.question || ''}</td>
      <td contenteditable="true" data-field="options">${JSON.stringify(q.options || [])}</td>
      <td contenteditable="true" data-field="correct">${JSON.stringify(q.correct || [])}</td>
      <td contenteditable="true" data-field="image">${q.image || ''}</td>
      <td><button class="delete-btn">❌ Supprimer</button></td>
    `;
    tbody.appendChild(tr);

    // 🔹 Supprimer
    tr.querySelector('.delete-btn').onclick = async () => {
      if (!confirm('Supprimer cette question ?')) return;
      try {
        const res = await fetch(`/api/adminquestions/${q.id}`, { method: 'DELETE' });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || "Erreur serveur");
        tr.remove();
      } catch (err) {
        console.error("❌ Delete error:", err);
        alert("Erreur suppression : " + err.message);
      }
    };
  });
}

// 🔹 Ajouter une nouvelle question
document.getElementById('add-question-btn').onclick = () => {
  const tr = document.createElement('tr');
  tr.dataset.id = ''; // nouvelle question sans ID
  tr.innerHTML = `
    <td>—</td>
    <td contenteditable="true" data-field="faculte">Nouvelle faculté</td>
    <td contenteditable="true" data-field="module">Nouveau module</td>
    <td contenteditable="true" data-field="cours">Nouveau cours</td>
    <td contenteditable="true" data-field="question">Nouvelle question</td>
    <td contenteditable="true" data-field="options">["Option1","Option2"]</td>
    <td contenteditable="true" data-field="correct">["Option1"]</td>
    <td contenteditable="true" data-field="image"></td>
    <td><button class="delete-btn">❌ Supprimer</button></td>
  `;
  tbody.appendChild(tr);

  tr.querySelector('.delete-btn').onclick = () => tr.remove();
};

// 🔹 Sauvegarder tout
document.getElementById('save-all-btn').onclick = async () => {
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const updates = rows.map(tr => {
    const id = tr.dataset.id;
    const data = {};
    tr.querySelectorAll('[data-field]').forEach(td => {
      const field = td.dataset.field;
      let value = td.innerText;
      if (field === 'options' || field === 'correct') {
        try { value = JSON.parse(value); } catch { value = []; }
      }
      data[field] = value;
    });
    return { id, ...data };
  });

  try {
    const res = await fetch('/api/save-questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questions:updates })
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || "Erreur serveur");
    alert('✅ Toutes les modifications ont été sauvegardées');
    loadQuestions();
  } catch (err) {
    console.error("❌ Save all error:", err);
    alert("Erreur sauvegarde : " + err.message);
  }
};


// 🔹 Initialisation
loadQuestions();
</script>
</body>
</html>
