  <title>Admin - Gestion Questions</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ccc; padding: 8px; vertical-align: top; }
    th { background: #007bff; color: white; }
    td[contenteditable="true"] { background: #ffffe0; }
    button { margin: 2px; cursor: pointer; }
    #add-question-btn, #save-all-btn { margin: 10px 5px; padding: 8px 12px; font-size: 16px; }
    img { max-width: 80px; }
    pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; }
  </style>
</head>
<body>
  <h1>📘 Panel Admin - Gestion des Questions</h1>

  <button id="add-question-btn">➕ Ajouter Question</button>
  <button id="save-all-btn">💾 Sauvegarder tout</button>

  <table id="table-questions">
    <thead>
      <tr>
        
        <th>Faculté</th>
        <th>Module</th>
        <th>Cours</th>
        <th>Question</th>
        <th>Options (JSON)</th>
        <th>Réponses correctes (JSON)</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  let questions = [];
let isLoading = false; // empêche les doubles appels

  async function saveAll() {
  const changedQuestions = questions
  .filter(q => ["new", "changed", "deleted"].includes(q.state))
  .map(q => ({
    faculte: q.faculte,
    module: q.module,
    cours: q.cours,
    question: q.question,
    oldQuestion: q.oldQuestion || null,
    options: q.options,
    correct: q.correct,
    image: q.image,
    state: q.state,
      oldData: q.oldData || null
  }));

console.log("🧩 [DEBUG] Tentative suppression :", changedQuestions);
console.log("🧠 [DEBUG] IDs envoyés au serveur :", changedQuestions.map(q => q.id));

  try {
    console.table(questions.filter(q => q.state === "deleted"));
    const res = await fetch("/api/saveChanges", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ questions: changedQuestions })
    });

    const data = await res.json();
    if (data.success) {
      alert("✅ Changements sauvegardés !");
      loadQuestions(); // recharger la table depuis la base
    } else {
      alert("❌ Erreur : " + data.message);
    }
  } catch (err) {
    console.error("Erreur saveAll:", err);
    alert("Erreur réseau : " + err.message);
  }
}
// enable editing mode for a line
function enableEdit(index) {
  const q = questions[index];
  // sauvegarde la version avant modification (copie profonde)
  q.oldData = JSON.parse(JSON.stringify(q));
  q.state = q.state === "new" ? "new" : "editing";
  renderQuestions();
}

// cancel editing and restore oldData
function cancelEdit(index) {
  const q = questions[index];
  if (q.oldData) {
    // restaure valeurs
    q.faculte = q.oldData.faculte;
    q.module = q.oldData.module;
    q.cours = q.oldData.cours;
    q.question = q.oldData.question;
    q.options = q.oldData.options;
    q.correct = q.oldData.correct;
    q.image = q.oldData.image;
    q.oldData = null;
  }
  q.state = q.state === "new" ? "new" : "unchanged";
  renderQuestions();
}

// accept edit, mark as changed
function validateEdit(index) {
  const q = questions[index];
  // si on veut, on peut vérifier qu'au moins un champ a changé
  q.state = q.state === "new" ? "new" : "changed";
  renderQuestions();
}
// update a single field while editing
function updateField(index, field, value) {
  const q = questions[index];
  if (!q) return;
  if (field === "options" || field === "correct") {
    // try to parse JSON if user types JSON
    if (typeof value === "string") {
      try { value = JSON.parse(value); } catch { /* assume it's already array when passed */ }
    }
  }
  q[field] = value;
}

function handleInputChange(index, field, value) {
   if (!questions[index]) return;
   
  // ✅ On change l’état UNE SEULE FOIS
  if (questions[index].state === "unchanged" && field === "question") {
    // Sauvegarder l'ancienne question avant modification
    questions[index].oldQuestion = questions[index].question;
  }
// ✅ Met à jour la valeur
  if (field !== "id") questions[index][field] = value;
 if (questions[index].state === "unchanged") {
    questions[index].state = "changed";
  }
  
  // 🚫 Si c’est déjà "new" ou "changed", on ne fait rien
  // (donc pas de reassignation inutile)

  // ✅ Met juste à jour le badge de statut visuel
  const tr = document.querySelectorAll('tbody tr')[index];
  if (tr) {
    const span = tr.querySelector('span');
    if (span) {
      span.textContent = `(${questions[index].state})`;
      span.style.color =
        questions[index].state === 'new' ? 'green' :
        questions[index].state === 'changed' ? 'orange' :
        questions[index].state === 'deleted' ? 'red' : '#888';
    }
  }
}

function deleteQuestion(index) {
  if (questions[index].state === "new") {
    questions.splice(index, 1);
  } else {
    questions[index].state = "deleted";
  }
  renderQuestions();

  const tr = document.querySelectorAll('tbody tr')[index];
  if (tr) tr.style.opacity = "0.5";
}

function addQuestion() {
  const newQuestion = {
    id: null,
    faculte: "",
    module: "",
    cours: "",
    question: "",
    options: ["", "", "", ""],
    correct: [],
    image: "",
    state: "new",
    oldData: null
  };
  questions.push(newQuestion);
  renderQuestions();
}

const tbody = document.querySelector('#table-questions tbody');

// 🔹 Charger toutes les questions
async function loadQuestions() {
  if (isLoading) return;
  isLoading = true;
  try {
    const res = await fetch('/api/adminquestions');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error('Format inattendu');
    questions = data.questions.map(q => ({ ...q })); // shallow copy
    renderQuestions();
  } catch (e) {
    console.error(e);
    alert('Erreur: ' + e.message);
  } finally {
    isLoading = false;
  }
}
// render function with edit/validate/cancel controls
function renderQuestions() {
  const tbody = document.querySelector('#table-questions tbody');
  tbody.innerHTML = '';
  questions.forEach((q, index) => {
    const tr = document.createElement('tr');

    // id hidden cell
    const idCell = document.createElement('td');
    idCell.style.display = 'none';
    idCell.textContent = q.id ?? '';
    tr.appendChild(idCell);

    function makeCell(field, isTextarea = false) {
      const td = document.createElement('td');
      if (q.state === 'editing') {
        const input = isTextarea ? document.createElement('textarea') : document.createElement('input');
        input.value = (field === 'options' || field === 'correct') ? JSON.stringify(q[field] || []) : (q[field] ?? '');
        input.oninput = (e) => updateField(index, field, isTextarea ? e.target.value : e.target.value);
        td.appendChild(input);
      } else {
        td.contentEditable = false;
        td.textContent = (field === 'options' || field === 'correct') ? JSON.stringify(q[field] || []) : (q[field] ?? '');
      }
      return td;
    }

    tr.appendChild(makeCell('faculte'));
    tr.appendChild(makeCell('module'));
    tr.appendChild(makeCell('cours'));
    tr.appendChild(makeCell('question', true));
    tr.appendChild(makeCell('options', true));
    tr.appendChild(makeCell('correct', true));
    tr.appendChild(makeCell('image'));

    const actionsTd = document.createElement('td');

    // Delete button (mark deleted)
    const delBtn = document.createElement('button');
    delBtn.textContent = '❌';
    delBtn.onclick = () => {
      if (q.state === 'new') {
        questions.splice(index, 1);
      } else {
        q.state = 'deleted';
      }
      renderQuestions();
    };
    actionsTd.appendChild(delBtn);

    // Edit / Validate / Cancel buttons
    if (q.state === 'editing') {
      const saveBtn = document.createElement('button');
      saveBtn.textContent = '✅ Valider';
      saveBtn.onclick = () => validateEdit(index);
      actionsTd.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = '❌ Annuler';
      cancelBtn.onclick = () => cancelEdit(index);
      actionsTd.appendChild(cancelBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.textContent = '📝 Modifier';
      editBtn.onclick = () => enableEdit(index);
      actionsTd.appendChild(editBtn);

      // visual state badge
      const span = document.createElement('span');
      span.style.fontSize = '12px';
      span.style.marginLeft = '6px';
      span.style.color =
        q.state === 'new' ? 'green' :
        q.state === 'changed' ? 'orange' :
        q.state === 'deleted' ? 'red' : '#888';
      span.textContent = `(${q.state})`;
      actionsTd.appendChild(span);
    }

    if (q.state === 'deleted') {
      tr.style.opacity = '0.5';
    }

    tr.appendChild(actionsTd);
    tbody.appendChild(tr);
  });
}


document.getElementById('add-question-btn').onclick = addQuestion;
document.getElementById('save-all-btn').onclick = saveAll;

loadQuestions();
</script>
</body>
</html>
