<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/faq.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="logo/favicon.svg" />
    <link rel="shortcut icon" href="logo/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="QCMed" />
    <link rel="manifest" href="logo/site.webmanifest" />

    <title>FAQ - QCMed</title>
</head>
<body class="faq-body">

    <div class="faq-page">
        <div class="faq-inner">

            <!-- Bouton retour -->
            <a href="javascript:history.back()" class="faq-back" aria-label="Retour">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                Retour
            </a>

            <!-- En-tête -->
            <div class="faq-header">
                <div class="faq-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>
                    </svg>
                    FAQ
                </div>
                <h1>Foire aux questions</h1>
                <p>Trouvez rapidement les réponses à vos questions sur QCMed.</p>
            </div>

            <!-- Barre de recherche -->
            <div class="search-wrap">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </span>
                <input type="text" id="faq-search" placeholder="Rechercher une question…" aria-label="Rechercher une question">
            </div>

            <!-- Liste FAQ générée par JS -->
            <div id="faq-list"></div>

            <!-- Footer -->
            <footer class="faq-footer">
                &copy; 2025 QCMed. Tous droits réservés.
            </footer>

        </div>
    </div>

    <script src="script/FAQ.js"></script>
</body>
</html>
