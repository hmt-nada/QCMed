<p class="bigtitle postit" >Bravo ! Vous êtes arrivé(e) au bout de ce QCM</p>

<p class="bigtitlenote" id="lanote" ></p><br>
<p class="note" id="note" style="display: none;"></p>

<p class="bigtitlemark"id="remark2" ></p><br>
<p class="bigtitlemark2" id="remark" ></p>


<div  class="buttcorr">
<button class="button" id="btnCorrige">
  <span class="shadow"></span>
  <span class="edge"></span>
  <div class="front">
    <span style="font-family: 'Poppins',sans-serif;">Afficher le corrigé  du QCM</span>
  </div>
</button>
</div>
<div  class="buttrefais" id="btnrefais">
<button class="button">
  <span class="shadow"></span>
  <span class="edge"></span>
  <div class="front">
    <span style="font-family: 'Poppins',sans-serif;">Nouvelle tentative sur les questions ratées</span>
  </div>
</button>
</div>
<!-- -------- POPUP -------- -->
<div class="popup2-overlay" id="popup">
  <div class="popup2">
    <h2>Quel corrigé voulez-vous voir ?</h2>
    <button class="btn-all" id="corrigeAll">Tout le QCM</button>
    <button class="btn-false" id="corrigeFalse">Seulement les fausses</button>
    <br/>
    <button class="btn-cancel" id="cancel">Annuler</button>
  </div>
</div>
<!--popup dans le cas ou toutes les réponses de l'utilisateur sont justes -->

<div id="popupSucces" class="popup-succes">
  <span class="popup-close" onclick="closePopup()">&times;</span>
  <div class="popup-content">
    <h3>Bravo !</h3>
    <p>Toutes vos réponses sont correctes. Aucune question ratée !</p>
  </div>
</div>
