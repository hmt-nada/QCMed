<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Navbar -->
  <link rel="stylesheet" href="css/navbar.css"/>
  <!-- CSS propre à cette page -->
  <link rel="stylesheet" href="css/accueil.css"/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400;700&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo/favicon-96x96.png" sizes="96x96"/>
  <link rel="icon" type="image/svg+xml" href="logo/favicon.svg"/>
  <link rel="shortcut icon" href="logo/favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-title" content="QCMed"/>
  <link rel="manifest" href="logo/site.webmanifest"/>

  <title>Accueil - QCMed</title>
</head>

<body class="accueil-body">

  <!-- ═══════════ LOADER ═══════════ -->
  <div id="loader" class="spinner">
    <div class="dot1"></div>
    <div class="dot2"></div>
    <div class="dot3"></div>
  </div>

  <!-- ═══════════ CONTENU ═══════════ -->
  <div id="content" style="display:none;">

    <!-- Navbar injectée par navbar.js -->
    <div id="navbar-container"></div>

    <!-- ── HERO HEADER ── -->
    <header class="accueil-hero">

      <!-- Badge décoratif -->
      <div class="hero-badge">
        <span class="badge-quiz">QUIZ</span>
        <span class="badge-time">TIME</span>
      </div>

      <!-- Texte de bienvenue -->
      <div class="hero-welcome" id="inscrivez">
        <p class="hero-title">Bienvenu(e)</p>
        <p class="hero-pseudo" id="pseudo2">user</p>
      </div>

      <!-- Barre de recherche -->
      <div class="hero-search-wrapper">
        <label class="search-label">Rechercher</label>
        <div class="search-box" id="mainbox">
          <div class="search-icon-wrap">
            <svg viewBox="0 0 512 512" height="1em" xmlns="http://www.w3.org/2000/svg" class="search_icon">
              <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
            </svg>
          </div>
          <input id="search" class="search_input" placeholder="Taper un module…" type="text"/>
        </div>
      </div>

    </header>

    <!-- ── BANNIÈRE D'INFORMATION POUR COMPTES D'UNE AUTRE ANNÉE ── -->
    <div id="annee-fallback-banner" class="annee-fallback-banner" style="display:none;" role="status">
      <div class="annee-fallback-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <div class="annee-fallback-text">
        <strong>Information sur votre compte :</strong> Actuellement, seule la <strong>1ère année</strong> est disponible sur QCMed. Vous avez donc accès aux modules et QCM de la 1ère année. Les autres années seront ajoutées très prochainement !
      </div>
    </div>

    <!-- ── GRILLE DES MODULES ── -->
    <main class="modules-section">
      <div id="modules-list" class="modules-grid"></div>
    </main>

  </div><!-- fin #content -->

  <script src="script/navbar.js"></script>
  <script src="script/accueil.js"></script>
</body>
</html>
